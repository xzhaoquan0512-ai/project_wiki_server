# Replace /absolute/path/project_wiki_server with the actual service directory.
# On Windows, paths such as D:/Code/project_wiki_server are accepted.
# PROJECT_WIKI_VAULT and PROJECT_WIKI_CONFIG must be absolute: relative values would follow
# the MCP client's working directory. PROJECT_WIKI_STATE resolves against the service
# directory when relative, but keep it absolute so it cannot land inside a registered project.
[mcp_servers.knowledge]
command = "node"
args = ["/absolute/path/project_wiki_server/bin/project-wiki-server.mjs", "wiki"]
startup_timeout_sec = 30
tool_timeout_sec = 180
# Optional: select a specific vault instead of the default data/vault under the service directory.
# env = { PROJECT_WIKI_VAULT = "/absolute/path/to/vault" }
# Optional: enable legacy .doc/.ppt conversion with an installed LibreOffice.
# On Windows use the soffice.com executable, not the soffice.exe GUI stub.
# env = { PROJECT_WIKI_LIBREOFFICE = "/usr/bin/soffice" }
# Optional: raise the per-source limit from the 20 MiB default (integer 1..64).
# An out-of-range value stops the service at startup instead of being ignored.
# env = { PROJECT_WIKI_MAX_SOURCE_MIB = "32" }
# Optional: limit this knowledge client to query tools.
# enabled_tools = ["wiki_read_rules", "wiki_read_index", "wiki_read_note", "wiki_search", "wiki_status", "wiki_lint", "wiki_list_sources", "wiki_read_source", "wiki_check_sources", "wiki_note_history"]

[mcp_servers.project]
command = "node"
args = ["/absolute/path/project_wiki_server/bin/project-wiki-server.mjs", "project"]
startup_timeout_sec = 30
# Must exceed project_git_status timeout_seconds (up to 120) plus the 10 seconds the service
# reserves to save the backend's timeout receipt. A smaller value cuts the call off first.
tool_timeout_sec = 180
# Optional: keep generic query sessions outside every registered project root.
# env = { PROJECT_WIKI_STATE = "/absolute/path/to/project-sessions" }

# ---------------------------------------------------------------------------
# Alternative: keep the service on a Linux host and reach it over SSH stdio.
# `ProgramData` is required on Windows clients: the MCP stdio transport inherits a
# fixed allowlist that omits it, and ssh exits 255 without output when it is missing
# (the client would only report "MCP error -32000: Connection closed").
# Use a passphrase-free key or SSH_ASKPASS; there is no TTY for a passphrase prompt.
# ---------------------------------------------------------------------------
# [mcp_servers.knowledge_remote]
# command = "ssh"
# args = ["-o", "BatchMode=yes", "-o", "IdentitiesOnly=yes", "-i", "C:/Users/me/.ssh/id_ed25519_deploy",
#         "ubuntu@server.example", "env PROJECT_WIKI_LIBREOFFICE=/usr/bin/soffice PROJECT_WIKI_MAX_SOURCE_MIB=32 bash /home/ubuntu/project-wiki-server/deploy/ssh/start-wiki.sh"]
# startup_timeout_sec = 30
# tool_timeout_sec = 180
# env = { ProgramData = "C:/ProgramData" }
# SSH-local env is not automatically forwarded; set service variables in the remote command as above.
