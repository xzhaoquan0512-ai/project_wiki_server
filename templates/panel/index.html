<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库管理面板</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <div class="top-title">
    <h1>知识库管理面板</h1>
    <p id="vault-line" class="muted">正在连接…</p>
  </div>
  <div id="badges" class="badges"></div>
</header>
<nav id="tabs" class="tabs">
  <button type="button" class="tab active" data-view="overview">概览</button>
  <button type="button" class="tab" data-view="notes">笔记</button>
  <button type="button" class="tab" data-view="sources">原始资料</button>
  <button type="button" class="tab" data-view="audit">审计</button>
  <button type="button" class="tab" data-view="maintenance">维护</button>
  <button type="button" class="tab" data-view="rules">目录与规范</button>
</nav>
<main>
  <section id="view-overview" class="view"></section>
  <section id="view-notes" class="view" hidden></section>
  <section id="view-sources" class="view" hidden></section>
  <section id="view-audit" class="view" hidden></section>
  <section id="view-maintenance" class="view" hidden></section>
  <section id="view-rules" class="view" hidden></section>
</main>
<script src="/app.js" type="module"></script>
</body>
</html>
